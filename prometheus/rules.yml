groups:
  - name: kubernetes
    rules:
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          namespace: "{{ $labels.namespace }}"
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} がCrashLoopしています"

      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0
        for: 5m
        labels:
          severity: warning
          namespace: "{{ $labels.namespace }}"
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} が5分以上NotReady"
