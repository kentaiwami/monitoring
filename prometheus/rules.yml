groups:
  - name: kubernetes
    rules:
      - alert: PodCrashLooping
        expr: sum without(instance, job) (increase(kube_pod_container_status_restarts_total{namespace=~"neko|sensor-api|sensor-view"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          namespace: "{{ $labels.namespace }}"
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} がCrashLoopしています"

      - alert: PodNotReady
        expr: sum without(instance, job) (kube_pod_status_ready{condition="true", namespace=~"neko|sensor-api|sensor-view"}) == 0
        for: 5m
        labels:
          severity: warning
          namespace: "{{ $labels.namespace }}"
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} が5分以上NotReady"
