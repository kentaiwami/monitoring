groups:
  - name: kubernetes
    rules:
      - alert: PodCrashLooping
        expr: sum without(instance, job) (increase(kube_pod_container_status_restarts_total{namespace!~"kube-system|kube-public|monitoring"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          namespace: "{{ $labels.namespace }}"
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} がCrashLoopしています"

      - alert: PodNotReady
        expr: sum without(instance, job) (kube_pod_status_ready{condition="true", namespace!~"kube-system|kube-public|monitoring"} unless on(pod, namespace) kube_pod_status_phase{phase=~"Succeeded|Failed"}) == 0
        for: 1m
        labels:
          severity: critical
          namespace: "{{ $labels.namespace }}"
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} が1分以上NotReady"

      - alert: DeploymentReplicasMismatch
        expr: sum without(instance, job) (kube_deployment_status_replicas_available{namespace!~"kube-system|kube-public|monitoring"}) < sum without(instance, job) (kube_deployment_spec_replicas{namespace!~"kube-system|kube-public|monitoring"})
        for: 1m
        labels:
          severity: warning
          namespace: "{{ $labels.namespace }}"
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} のreplicas数が不足しています"

      - alert: SensorDataNotReceived
        expr: time() - max without(instance, job) (sensor_last_received_timestamp) > 60
        for: 1m
        labels:
          severity: warning
          namespace: sensor-api
        annotations:
          summary: "センサー {{ $labels.table }} のデータが1分以上受信されていません"

      - alert: CronJobFailed
        expr: kube_job_failed{namespace!~"kube-system|kube-public|monitoring", condition="true"} > 0
        for: 0m
        labels:
          severity: critical
          namespace: "{{ $labels.namespace }}"
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} が失敗しました"

      - alert: CronJobNotCompleted
        expr: (time() - kube_cronjob_status_last_successful_time{namespace!~"kube-system|kube-public|monitoring"}) > 86400 + 3600
        for: 0m
        labels:
          severity: warning
          namespace: "{{ $labels.namespace }}"
        annotations:
          summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} が25時間以上正常完了していません"

  - name: smell
    rules:
      - alert: SmellHigh
        expr: max by(sensor_id) (sensor_smell) > 0.8
        for: 1m
        labels:
          severity: warning
          channel: smell
        annotations:
          summary: "{{ $labels.sensor_id }} の臭気が高くなっています ({{ $value }}V)"

      - alert: SmellCritical
        expr: max by(sensor_id) (sensor_smell) > 1.5
        for: 1m
        labels:
          severity: critical
          channel: smell
        annotations:
          summary: "{{ $labels.sensor_id }} の臭気が非常に高くなっています ({{ $value }}V)"

  - name: co2
    rules:
      - alert: CO2High
        expr: max by(sensor_id) (sensor_co2) > 1000
        for: 1m
        labels:
          severity: warning
          channel: co2
        annotations:
          summary: "{{ $labels.sensor_id }} のCO2濃度が1000ppmを超えています ({{ $value }}ppm)"

      - alert: CO2Critical
        expr: max by(sensor_id) (sensor_co2) > 2000
        for: 1m
        labels:
          severity: critical
          channel: co2
        annotations:
          summary: "{{ $labels.sensor_id }} のCO2濃度が2000ppmを超えています ({{ $value }}ppm)"

  - name: node
    rules:
      - alert: NodeCPUHigh
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          channel: monitoring
        annotations:
          summary: "{{ $labels.instance_name }} のCPU使用率が80%を超えています"

      - alert: NodeMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
          channel: monitoring
        annotations:
          summary: "{{ $labels.instance_name }} のメモリ使用率が80%を超えています"

      - alert: PodCPUHigh
        expr: sum by(namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!=""}[5m])) / sum by(namespace, pod, container) (kube_pod_container_resource_requests{resource="cpu", container!=""}) * 100 > 80
        for: 5m
        labels:
          severity: warning
          channel: monitoring
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} のCPU使用率がリクエストの80%を超えています"

      - alert: PodMemoryHigh
        expr: sum by(namespace, pod, container) (container_memory_working_set_bytes{container!=""}) / sum by(namespace, pod, container) (kube_pod_container_resource_requests{resource="memory", container!=""}) * 100 > 80
        for: 5m
        labels:
          severity: warning
          channel: monitoring
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} のメモリ使用率がリクエストの80%を超えています"

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.2
        for: 5m
        labels:
          severity: warning
          channel: monitoring
        annotations:
          summary: "{{ $labels.instance_name }} の {{ $labels.mountpoint }} ディスク残量が20%未満です"

      - alert: DiskSpaceCritical
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.1
        for: 5m
        labels:
          severity: critical
          channel: monitoring
        annotations:
          summary: "{{ $labels.instance_name }} の {{ $labels.mountpoint }} ディスク残量が10%未満です"

      - alert: InodeLow
        expr: node_filesystem_files_free{fstype!~"tmpfs|overlay"} / node_filesystem_files{fstype!~"tmpfs|overlay"} < 0.2
        for: 5m
        labels:
          severity: warning
          channel: monitoring
        annotations:
          summary: "{{ $labels.instance_name }} の {{ $labels.mountpoint }} inode残量が20%未満です"
