global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['10.0.10.97:32300', '10.0.29.194:32300']
