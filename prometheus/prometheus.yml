global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['10.0.10.97:32300', '10.0.29.194:32300']

  - job_name: 'sensor-api'
    static_configs:
      - targets: ['10.0.10.97:32224', '10.0.29.194:32224']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['10.0.10.97:9100', '10.0.29.194:9100', '10.0.2.156:9100']
