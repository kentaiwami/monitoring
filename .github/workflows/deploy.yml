name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy secrets
        run: |
          cp ~/monitoring/alertmanager/alertmanager.yml alertmanager/alertmanager.yml
          cp ~/monitoring/.env .env

      - name: Pull and restart
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
