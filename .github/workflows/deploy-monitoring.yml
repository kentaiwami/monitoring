name: Deploy Monitoring (Docker Compose)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy secrets
        run: |
          aws s3 cp s3://${{ secrets.CONFIG_BUCKET }}/monitoring/alertmanager.yml alertmanager/alertmanager.yml
          aws s3 cp s3://${{ secrets.CONFIG_BUCKET }}/monitoring/env .env

      - name: Pull and restart
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose restart prometheus alertmanager grafana loki

      - name: Notify Slack on success
        if: success()
        run: |
          curl -s -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"✅ Deploy succeeded: `${{ github.ref_name }}` @ `${{ github.sha }}`"}'

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -s -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ Deploy failed: `${{ github.ref_name }}` @ `${{ github.sha }}`"}'
